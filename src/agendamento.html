<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetCare - Agendamento de Consultas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="index.html">⬅️ Voltar ao Menu</a>
  <h1>📅 Agendamento de Consultas</h1>

  <h2>Nova consulta</h2>
  <form id="form-agendamento">
    <label for="tutor">Tutor:</label>
    <select id="tutor" required></select>

    <label for="pet">Pet:</label>
    <select id="pet" required></select>

    <label for="data">Data:</label>
    <input type="date" id="data" required>

    <label for="horario">Horário:</label>
    <input type="time" id="horario" required>

    <label for="veterinario">Veterinário:</label>
    <input type="text" id="veterinario" placeholder="Nome do veterinário" required>

    <label for="motivo">Motivo da consulta:</label>
    <input type="text" id="motivo" placeholder="Ex: Vacinação, check-up...">

    <button type="submit">Agendar</button>
  </form>

  <h2>Consultas agendadas</h2>
  <ul id="lista-agendamentos"></ul>

  <script src="agendamento_renderer.js"></script>
</body>
</html>
