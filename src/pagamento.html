<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetCenter - Gestão de Pets</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { max-width: 1500px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #f4f4f4; }
  </style>
</head>
<a href="agendamento.html">⬅️ Voltar ao Agendamento</a>
  <h1>📅 Pagamentos</h1>

  <h2>Formulário de Pagamento</h2>
  <form id="form-pagamento">
   <label for="metodo">Método de pagamento</label>
    <select id="metodo" required>
      <option value="PIX">PIX</option>
      <option value="Cartão de Crédito">Cartão de Crédito</option>
      <option value="Cartão de Débito">Cartão de Débito</option>
    </select>
<!-- Cartão de Crédito -->
<div id="campos-cartao" style="display: none;">
    <label for="numero-cartao">Número do cartão</label>
    <input type="text" id="numero-cartao" placeholder="0000 0000 0000 0000" maxlength="19">

    <label for="nome-cartao">Nome no cartão</label>
    <input type="text" id="nome-cartao" placeholder="Ex: João da Silva">

    <div class="grid">
      <div>
        <label for="validade-cartao">Validade</label>
        <input type="text" id="validade-cartao" placeholder="MM/AA" maxlength="5">
      </div>
      <div>
        <label for="cvv-cartao">CVV</label>
        <input type="text" id="cvv-cartao" placeholder="123" maxlength="4">
      </div>
    </div>
  </div>
<!-- PIX -->
  <div id="campos-pix" style="display: none;">
    <label for="chave-pix">Chave PIX (opcional)</label>
    <input type="text" id="chave-pix" placeholder="CPF, e-mail ou telefone">
  </div>

  <label for="valor">Valor do pagamento</label>
  <input type="number" id="valor" placeholder="Ex: 100.00" required>

  <label for="data">Data do pagamento</label>
  <input type="date" id="data" required>

  <button type="submit">Registrar pagamento</button>
</form>

    <h2 style="margin-top: 30px; font-size: 1.3rem;">Pagamentos Registrados</h2>
    <ul id="lista"></ul>
    
    <script src="pagamento_renderer.js"></script>
</body>
</html>
