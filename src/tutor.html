<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetCare - Gestão de Tutores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back" href="index.html">← Voltar ao menu</a>

  <header>
    <div class="eyebrow">Ficha de cadastro</div>
    <h1>
      Cadastro de Tutores
    </h1>
    <p class="sub">Preencha os dados do tutor e do pet para abrir o prontuário na VetCenter.</p>
  </header>

  <!-- Desenvolva o formulário de cadastro de tutor abaixo -->
  <form id="form-tutor">
    <div class="section-label"><span class="tag">01</span> Dados do tutor</div>

    <label for="nome">Nome completo do tutor</label>
    <input type="text" id="nome" placeholder="Ex: Ana Beatriz Souza" required>

    <label for="telefone">Número de telefone do tutor</label>
    <input type="text" id="telefone" placeholder="(00) 00000-0000" required>

    <label for="email">Email do tutor</label>
    <input type="email" id="email" placeholder="nome@email.com" required>

    <label for="cpf">CPF do tutor</label>
    <input type="text" id="cpf" placeholder="000.000.000-00" required>

    <label for="endereco">Endereço do tutor</label>
    <input type="text" id="endereco" placeholder="Rua, número, bairro, cidade" required>

    <div class="section-label"><span class="tag">02</span> Dados do pet</div>

    <label for="petNome">Nome do pet</label>
    <input type="text" id="petNome" placeholder="Ex: Thor" required>

    <label for="petIdade">Idade do pet</label>
    <input type="number" id="petIdade" placeholder="Em anos" min="0" required>

    <button type="submit">Cadastrar tutor</button>
  </form>

  <h2 style="margin-top: 30px; font-size: 1.3rem;">Tutores cadastrados</h2>
  <ul id="lista"></ul>

  <script src="tutor_renderer.js"></script>
</body>
</html>
