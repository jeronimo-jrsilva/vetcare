<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetCare - Gestão de Tutores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #f4f4f4; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Voltar ao menu</a>

  <main>
    <header>
      <div class="eyebrow">Ficha de cadastro</div>
      <h1>Cadastro de Tutores</h1>
      <p class="sub">Preencha os dados do tutor e do(s) pet(s) para abrir o prontuário na VetCenter.</p>
    </header>

    <form id="form-tutor">
      <div class="section-label"><span class="tag">01</span> Dados do tutor</div>

      <label for="nome">Nome completo do tutor</label>
      <input type="text" id="nome" placeholder="Ex: Ana Beatriz Souza" required>

      <label for="telefone">Número de telefone do tutor</label>
      <input type="text" id="telefone" placeholder="(00) 00000-0000" required>
      <small id="erroTelefone" style="color: #e53e3e;"></small>

      <label for="email">Email do tutor</label>
      <input type="email" id="email" placeholder="nome@email.com" required>

      <label for="cpf">CPF do tutor</label>
      <input type="text" id="cpf" placeholder="000.000.000-00" required>
      <small id="erroCpf" style="color: #e53e3e;"></small>

      <label for="endereco">Endereço do tutor</label>
      <input type="text" id="endereco" placeholder="Rua, número, bairro, cidade" required>

      <div class="section-label"><span class="tag">02</span> Dados do(s) pet(s)</div>

      <div id="pets-container">
        <div class="pet-bloco" data-pet-index="0">
          <label for="petNome-0">Nome do pet</label>
          <input type="text" id="petNome-0" class="pet-nome" placeholder="Ex: Thor" required>

          <label for="petIdade-0">Idade do pet (em anos)</label>
          <input type="number" id="petIdade-0" class="pet-idade" min="0" max="40" required>
        </div>
      </div>

      <button type="button" id="btn-add-pet">+ Adicionar outro pet</button>

      <button type="submit">Cadastrar tutor</button>
    </form>

    <h2 style="margin-top: 30px; font-size: 1.3rem;">Tutores cadastrados</h2>
    <ul id="lista"></ul>
  </main>

  <script src="tutor_renderer.js"></script>
</body>
</html>
