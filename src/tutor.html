<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetCare - Gestão de Tutores</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #f4f4f4; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 20px; background: #747df7; color: white; border: none; cursor: pointer; }
    ul { margin-top: 30px; padding-left: 20px; }
    li { margin-bottom: 8px; }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Desenvolva o formulário de cadastro de tutor abaixo -->
  <a href="index.html">⬅️ Voltar ao Menu</a>
  <h1>👤 Cadastro de Tutores</h1>
 <form id="form-tutor">
    <label for="nome">Nome completo do tutor:</label>
    <input type="text" id="nome" required>

    <label for="telefone">Número de telefone do tutor:</label>
    <input type="text" id="telefone" required>

    <label for="email">Email do tutor:</label>
    <input type="email" id="email" required>

    <label for="cpf">CPF do tutor:</label>
    <input type="text" id="cpf" required>

    <label for="petNome">Nome do pet:</label>
    <input type="text" id="petNome" required>

    <label for="petIdade">Idade do pet:</label>
    <input type="number" id="petIdade" required>

    <button type="submit">Cadastrar</button>
    
  </form>

  <h2>Tutores cadastrados</h2>
  <ul id="lista"></ul>

  <script src="tutor_renderer.js"></script>
</body>
</html>
