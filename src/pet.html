<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetCare - Gestão de Pets</title>
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"> -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="index.html">⬅️ Voltar ao Menu</a>
  <h1>🐾 Cadastro de Pets</h1>
  <h2>Insira informações do pet:</h2>
  <form id="form-pet">
    <div>
      <input type = "text" id="nome" placeholder="Pet" required>
      <input type = "text" id="Raça" placeholder="Raça" required>
      <input type = "text" id="Gênero" placeholder="Gênero" required>
      <h4>Data de nascimento:</h4>
      <input type = "date" id="Data de nascimento" placeholder="Data de nascimento" required>
      <h4>Se sim, descreva:</h4>
      <input type = "text" id="Alergia" placeholder="Alergia" required>
      <h4>Observações:</h4>
      <input type = "text" id="observação" placeholder="" required>
    </div>
    <button type="submit">Cadastrar</button>
  </form>

  
  <!-- Desenvolva o formulário de cadastro de pet abaixo -->

  <script src="pet_renderer.js"></script>
</body>
</html>
