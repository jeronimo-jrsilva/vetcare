<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetCare - Gestão de Pets</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #f4f4f4; }
  </style>
</head>
<body>
  <a href="index.html">⬅️ Voltar ao Menu</a>
  
  <h1>🐾 Cadastro de Pets</h1>
  <p>Preencha os dados para registrar um novo pet na clínica:</p>

  <form id="form-pet">
    <label for="tutor">Tutor Responsável:</label>
    <select id="tutor">
      <option value="">Selecione um tutor (opcional)...</option>
    </select>

    <label for="Nome">Nome do Pet:</label>
    <input type="text" id="Nome" placeholder="Ex: Mel" required>

    <label for="Raca">Raça do Pet:</label>
    <input type="text" id="Raca" placeholder="Ex: Poodle, SRD, Siamês..." required>

    <label for="Genero">Gênero do Pet:</label>
    <select id="Genero" required>
      <option value="Macho">Macho</option>
      <option value="Fêmea">Fêmea</option>
    </select>

    <label for="Datadenascimento">Data de Nascimento (aproximada):</label>
    <input type="date" id="Datadenascimento">

    <label for="Observacao">Observações (Alergias, Cuidados, etc.):</label>
    <input type="text" id="Observacao" placeholder="Ex: Alérgico a dipirona">

    <button type="submit">Cadastrar Pet</button>
  </form>

  <h2 style="margin-top: 30px; font-size: 1.3rem;">Pets Cadastrados</h2>
  <ul id="lista"></ul>

  <script src="pet_renderer.js"></script>
</body>
</html>
