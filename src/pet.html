<head>

  <title>VetCare - Gestão de Pets</title>
    <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #f4f4f4; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 20px; background: #f8f8f9; color: white; border: none; cursor: pointer; }

    li { margin-bottom: 8px; }
  </style>
 <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css"> -->

</head>
<body>
  <a href="index.html">⬅️ Voltar ao Menu</a>
  
  <h1> Cadastro de Pets</h1>
  <h2>Insira informações do pet:</h2>
  <form id="form-pet">
    <div>
      <label for="cad_pet">Nome do pet:</label>
      <input type = "text" id="nome"  required>
      <label for="nome">Raça do pet:</label>
      <input type = "text" id="Raca" required>
      <label for="nome">Gênero do pet:</label>
      <input type = "text" id="Genero" required>
      <h4>Data de nascimento:</h4>
      <input type = "date" id="Datadenascimento" placeholder="Datadenascimento" required>
      <h4>Observações:</h4>
      <input type = "text" id="observacao" placeholder="Alergias, Cirurgias, etc..." required>
    </div>
    <button type="submit">Cadastrar</button>
  </form>

  <h2>Pets cadastrados</h2>
  <ul id="lista"></ul>

  <!-- Desenvolva o formulário de cadastro de pet abaixo -->

  <script src="pet_renderer.js"></script>
</body>
